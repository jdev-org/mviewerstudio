services:
  # Python version
  # Served under /${MVIEWERSTUDIO_URL_PATH_PREFIX}/ see docker/nginx/default.conf.template
  mviewerstudio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mviewer/mviewerstudio:latest
#    ports:
#      - "8000:8000"
    environment:
      - CONF_PATH_FROM_MVIEWER=apps/store
      - CONF_PUBLISH_PATH_FROM_MVIEWER=apps/public
      - DEFAULT_ORG=my_org
      - EXPORT_CONF_FOLDER=/home/mvuser/apps/store
      - MVIEWERSTUDIO_PUBLISH_PATH=/home/mvuser/apps/public
      - MVIEWERSTUDIO_URL_PATH_PREFIX=mviewerstudio
    volumes:
      - "./apps:/home/mvuser/apps"
      - "./src/static/config.json:/home/mvuser/src/static/config.json"
  # MCP server exposing MviewerStudio capabilities to AI assistants.
  # Connect MCP clients to http://localhost:8030/mcp
  mviewerstudio-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mviewer/mviewerstudio:latest
    command:
      - python
      - -m
      - src.mcp_server.server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8030"
    environment:
      - MVIEWERSTUDIO_BASE_URL=http://mviewerstudio:8000/mviewerstudio
      - MVIEWER_BASE_URL=http://localhost/mviewer/
      - MVIEWER_INSTANCE_PATH=/mviewer/
      - MVIEWER_CONF_PATH=apps/store/
      - MVIEWER_PUBLIC_PATH=apps/public
      - MCP_DEFAULT_USERNAME=ai
      - MCP_DEFAULT_ORG=my_org
      - MVIEWERSTUDIO_CONFIG_PATH=/home/mvuser/src/static/config.json
    ports:
      - "127.0.0.1:8030:8030"
    volumes:
      - "./src/static/config.json:/home/mvuser/src/static/config.json:ro"
    depends_on:
      - mviewerstudio
  # Served under /mviewer/ see docker/nginx/default.conf.template
  mviewer:
    depends_on:
      - mviewerstudio
    # this image is automatically built in
    # the mviewer/mviewer github repository
    # See https://github.com/mviewer/mviewer/pull/236
    image: mviewer/mviewer
    # ports:
    #   - "5051:80"
    volumes:
        - "./apps:/usr/share/nginx/html/apps:ro"
  # Reverse-proxy using nginx. Groups mviewer and mviewerstudio under respective paths
  # Config can be found under ./docker/nginx/default.conf.template
  www:
    image: nginx
    ports:
      - 80:80
    environment:
      - NGINX_HOST=localhost
      - MVIEWERSTUDIO_URL_PATH_PREFIX=mviewerstudio
    volumes:
      - ./docker/nginx:/etc/nginx/templates
      - "./apps:/usr/share/nginx/html/apps:ro"
    depends_on:
      - mviewerstudio
      - mviewer
